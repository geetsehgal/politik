<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brandmark">
      <span class="mark">politik</span>
      <span class="live" aria-hidden="true"></span>
    </div>
    <h1>Ops Console</h1>
    <span class="sub">Brand response desk</span>
  </header>

  <main class="dashboard">

    <!-- LEFT 50%: Recent Updates (top) + Quality Updates (below) -->
    <section class="col">
      <section class="panel panel--blue" id="recent-panel">
        <div class="panel-head">
          <h2>Recent updates</h2>
          <a class="view-all" href="updates.html">View all →</a>
        </div>
        <ul class="update-list" id="recent-updates-list"></ul>
      </section>

      <section class="panel panel--pink" id="quality-panel">
        <div class="panel-head">
          <h2>Quality updates</h2>
          <span class="count">10 mandatory points</span>
        </div>
        <ol class="quality-list" id="quality-updates-list"></ol>
      </section>
    </section>

    <!-- RIGHT 50%: one bordered block — heading, then selectors, then preview -->
    <section class="col">
      <section class="panel panel--lime" id="preview-panel">
        <div class="panel-head">
          <h2>Email preview</h2>
        </div>

        <div class="selectors">
          <div class="field">
            <label for="brand-select">Brand</label>
            <select id="brand-select">
              <option value="">Select a brand</option>
            </select>
          </div>
          <div class="field">
            <label for="scenario-select">Scenario</label>
            <select id="scenario-select">
              <option value="">Select a scenario</option>
            </select>
          </div>
        </div>

        <div class="preview-divider" aria-hidden="true"></div>

        <div id="email-preview"></div>
      </section>
    </section>

  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

    <section class="col">
      <section class="panel" style="flex: 0 0 auto;">
        <div class="selectors">
          <div class="field">
            <label for="brand-select">Brand</label>
            <select id="brand-select">
              <option value="">Select a brand</option>
            </select>
          </div>
          <div class="field">
            <label for="scenario-select">Scenario</label>
            <select id="scenario-select">
              <option value="">Select a scenario</option>
            </select>
          </div>
        </div>
      </section>

      <section class="panel" id="preview-panel">
        <div class="panel-head">
          <h2>Email preview</h2>
        </div>
        <div id="email-preview"></div>
      </section>
    </section>

  </main>
<footer class="site-footer">
  <a href="https://geetsehgal.neocities.org" target="_blank" rel="noopener">
    Made by Geet Sehgal
  </a>
</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
